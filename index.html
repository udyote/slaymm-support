<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Şlaymm: Bebekten Kaçış</title>
<meta name="description" content="Mor bir slime ol, oyuncakların arasından kay ve emekleyen bebeğe yakalanmadan 10 odadan kaç.">
<link rel="icon" href="icon.png">
<style>
/* VOICE: playful toy box. IDEA: a candy-coloured game box lid. PICTURE: the real screenshots fanned like cards.
   COLOUR: violet field, peach glow, amber accent. TYPE: Fredoka (Google Fonts). LAYOUT: logo + pitch, then three phones. */

:root{--bg:#2a1845;--ink:#fff8ef;--amber:#ffc23a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#8a4ff0 0%,#4a2580 40%,var(--bg) 75%);color:var(--ink);font:17px/1.55 Fredoka,system-ui,sans-serif;min-height:100vh;overflow-x:clip}
main{max-width:1100px;margin:0 auto;padding:clamp(28px,6vw,72px) 20px 40px;text-align:center}
.logo{width:min(560px,92%);filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.pill{display:inline-block;margin-top:4px;padding:8px 20px;border-radius:99px;background:var(--amber);color:#3a2400;font-weight:700;font-size:20px;box-shadow:0 4px 0 #c2860f;transform:rotate(-2deg)}
p.lead{max-width:560px;margin:26px auto 0;font-size:19px;opacity:.92}
.badges{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0 0}
.badges span{padding:12px 20px;border-radius:14px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.2);font-weight:500}
.phones{display:flex;justify-content:center;gap:0;margin:48px auto 0;max-width:900px}
.phones img{width:min(31%,250px);border-radius:28px;box-shadow:0 30px 60px rgba(10,0,30,.55);border:6px solid #1a1224}
.phones img:nth-child(1){transform:rotate(-7deg) translateY(24px);margin-right:-24px}
.phones img:nth-child(2){position:relative;z-index:1}
.phones img:nth-child(3){transform:rotate(7deg) translateY(24px);margin-left:-24px}
footer{margin-top:60px;font-size:14px;opacity:.75}footer a{color:var(--ink)}
@media(max-width:600px){.phones img{border-radius:18px;border-width:4px}}
</style>
</head>
<body><main>
<img class="logo" src="logo.png" alt="Şlaymm">
<div><span class="pill">Bebekten Kaçış</span></div>
<p class="lead">Mor bir slime ol, oyuncakların arasından kay ve emekleyen bebeğe yakalanmadan 10 odadan kaç. Tek parmakla oynanır, üyelik gerekmez.</p>
<div class="badges"><span>App Store'da yakında</span></div>
<div class="phones"><img src="shot2.jpg" alt="Bebek peşinde"><img src="shot1.jpg" alt="Çek, bırak, kay"><img src="shot3.jpg" alt="Jöleleri topla"></div>
<footer><p>Destek / Support: <a href="mailto:ugurdenizyavuz1@gmail.com">ugurdenizyavuz1@gmail.com</a></p><a href="privacy.html">Gizlilik Politikası / Privacy Policy</a></footer>
</main></body>
</html>
